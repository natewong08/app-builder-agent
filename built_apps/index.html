<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <!-- CSS linked above -->
</head>
<body>
    <div id="calculator" class="calculator">
        <div id="display" class="display"></div>
        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn" id="btn-7" data-key="digit">7</button>
            <button class="btn" id="btn-8" data-key="digit">8</button>
            <button class="btn" id="btn-9" data-key="digit">9</button>
            <button class="btn" id="btn-divide" data-key="operator">/</button>
            <!-- Row 2 -->
            <button class="btn" id="btn-4" data-key="digit">4</button>
            <button class="btn" id="btn-5" data-key="digit">5</button>
            <button class="btn" id="btn-6" data-key="digit">6</button>
            <button class="btn" id="btn-multiply" data-key="operator">*</button>
            <!-- Row 3 -->
            <button class="btn" id="btn-1" data-key="digit">1</button>
            <button class="btn" id="btn-2" data-key="digit">2</button>
            <button class="btn" id="btn-3" data-key="digit">3</button>
            <button class="btn" id="btn-subtract" data-key="operator">-</button>
            <!-- Row 4 -->
            <button class="btn" id="btn-0" data-key="digit">0</button>
            <button class="btn" id="btn-decimal" data-key="decimal">.</button>
            <button class="btn" id="btn-clear" data-key="clear">C</button>
            <button class="btn" id="btn-add" data-key="operator">+</button>
            <!-- Row 5 -->
            <button class="btn" id="btn-all-clear" data-key="all-clear" style="grid-column: span 2;">AC</button>
            <button class="btn" id="btn-equals" data-key="equals" style="grid-column: span 2;">=</button>
        </div>
    </div>
    <script src="app.js"></script>
    <!-- JS linked above -->
</body>
</html>
